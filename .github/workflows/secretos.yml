# Revisa cada push y pull request con gitleaks: si aparece una clave (por ejemplo la de Gemini), falla.
name: Buscar claves filtradas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Toda la historia: una clave borrada en un commit posterior sigue estando en el anterior.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
